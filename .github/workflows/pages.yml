name: Publish GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Validate public repository variables
        env:
          VITE_TOKEN_ADDRESS: ${{ vars.VITE_TOKEN_ADDRESS }}
          VITE_STAKING_ADDRESS: ${{ vars.VITE_STAKING_ADDRESS }}
          VITE_BURN_VAULT_ADDRESS: ${{ vars.VITE_BURN_VAULT_ADDRESS }}
          VITE_VESTING_ADDRESS: ${{ vars.VITE_VESTING_ADDRESS }}
          VITE_RPC_URL: ${{ vars.VITE_RPC_URL }}
        run: |
          for name in VITE_TOKEN_ADDRESS VITE_STAKING_ADDRESS VITE_BURN_VAULT_ADDRESS VITE_VESTING_ADDRESS VITE_RPC_URL; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Set repository variable ${name} before manually publishing Pages."
              exit 1
            fi
          done
      - name: Install app dependencies
        run: npm ci --prefix app
      - name: Build static dApp
        run: npm --prefix app run build
        env:
          VITE_TOKEN_ADDRESS: ${{ vars.VITE_TOKEN_ADDRESS }}
          VITE_STAKING_ADDRESS: ${{ vars.VITE_STAKING_ADDRESS }}
          VITE_BURN_VAULT_ADDRESS: ${{ vars.VITE_BURN_VAULT_ADDRESS }}
          VITE_VESTING_ADDRESS: ${{ vars.VITE_VESTING_ADDRESS }}
          VITE_CHAIN_ID: "97"
          VITE_RPC_URL: ${{ vars.VITE_RPC_URL }}
          VITE_BASE_PATH: /app/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Assemble static site
        run: |
          mkdir -p _site/app
          cp -R website/. _site/
          cp -R app/dist/. _site/app/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4